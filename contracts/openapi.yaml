    $ref: './payment-extensions.yaml#/paths/~1v1~1workspaces~1{workspaceID}~1sandbox~1reset'
  /v1/workspaces/{workspaceID}/documents/invoices/{documentID}/send:
    $ref: './payment-extensions.yaml#/paths/~1v1~1workspaces~1{workspaceID}~1documents~1invoices~1{documentID}~1send'
  /v1/workspaces/{workspaceID}/documents/invoices/{documentID}/remind:
    $ref: './payment-extensions.yaml#/paths/~1v1~1workspaces~1{workspaceID}~1documents~1invoices~1{documentID}~1remind'
  # End payment extension references
  /v1/commerce/orders:
    get:
      operationId: readCommerceOrders
      tags: [Merchant]
      summary: Read scoped operational orders
      description: Requires orders:read. Financial links are operational references, not a new payment authority.
      security:
        - MerchantBearer: []
      parameters:
        - name: environment
          in: query
          required: true
          schema: {type: string, enum: [live, sandbox]}
        - name: item
          in: query
          schema: {type: string, format: uuid}
        - name: cursor
          in: query
          schema: {type: integer, minimum: 0, maximum: 10000}
        - name: q
          in: query
          schema: {type: string, maxLength: 100}
      responses:
        '200':
          description: Authorized order list or detail
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        default:
          description: Authorization, validation or dependency failure
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
    post:
      operationId: createCommerceOrder
      tags: [Merchant]
      summary: Create a draft operational order with server catalog prices
      description: Requires orders:write. No financial payment is created. Caller prices, paid flags and source attribution are rejected. Confirm separately through the merchant workspace to reserve stock.
      security:
        - MerchantBearer: []
      parameters:
        - name: environment
          in: query
          required: true
          schema: {type: string, enum: [live, sandbox]}
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reference, warehouse_id, recipient, lines]
              properties:
                reference: {type: string, minLength: 1, maxLength: 80}
                warehouse_id: {type: string, format: uuid}
                customer_id: {type: string, format: uuid}
                recipient:
                  type: object
                  required: [name, phone, address]
                  properties:
                    name: {type: string, minLength: 1, maxLength: 160}
                    phone: {type: string, pattern: '^\+?[0-9]{7,15}$'}
                    address: {type: string, minLength: 3, maxLength: 1000}
                lines:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    additionalProperties: false
                    required: [variant_id, quantity]
                    properties:
                      variant_id: {type: string, format: uuid}
                      quantity: {type: integer, minimum: 1, maximum: 10000}
                coupon: {type: string, maxLength: 40}
                shipping_minor: {type: integer, minimum: 0, maximum: 100000000}
                notes: {type: string, maxLength: 2000}
      responses:
        '201':
          description: Draft order created or idempotently replayed
          content:
            application/json:
              schema:
                type: object
                required: [id, saved]
                properties:
                  id: {type: string, format: uuid}
                  saved: {type: boolean, const: true}
        default:
          description: Validation, authorization, rate limit or source failure
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
  /v1/public/checkout/{token}/notices/{noticeAction}:
    post:
      operationId: customerReceiptNotice
      summary: Subscribe, verify or withdraw consent-based receipt email
      description: Checkout capability and same-origin POST required. Contact never replaces payer. Subscription emails a purpose-scoped verification code; verification is single-use. SMTP acceptance is not inbox delivery or payment verification. Requires configured TLS SMTP and additive notice migration.
      security: []
      parameters:
        - in: path
          name: token
          required: true
          schema: {type: string, pattern: '^[A-Za-z0-9_-]{43}$'}
        - in: path
          name: noticeAction
          required: true
          schema: {type: string, enum: [subscribe, verify, withdraw]}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [email, consent]
                  properties:
                    email: {type: string, format: email, maxLength: 254}
                    consent: {type: boolean, enum: [true]}
                    locale: {type: string, enum: [en, bn], default: en}
                - type: object
                  additionalProperties: false
                  required: [code]
                  properties:
                    code: {type: string, pattern: '^[A-Za-z0-9_-]{43}$'}
      responses:
        '200':
          description: Contact verified or notice consent withdrawn; payment state unchanged
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, enum: [verified, withdrawn]}
        '202':
          description: Verification email accepted by SMTP; contact is not yet verified
        '403':
          description: Origin denied
        '404':
          description: Invalid checkout capability or action
        '422':
          description: Invalid contact, consent or expired/reused code
        '429':
          description: Rate limited
        '503':
          description: Notice service unavailable or verification delivery outcome unconfirmed
  /v1/workspaces/{workspaceID}/operations/{resource}:
    parameters:
      - {name: workspaceID, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: resource, in: path, required: true, schema: {type: string, enum: [overview, payments, incoming, gateways, devices, webhooks, deliveries, events, parsers]}}
      - {name: environment, in: query, required: true, schema: {type: string, enum: [sandbox, live]}}
      - {name: cursor, in: query, schema: {type: string, format: uuid}}
      - {name: status, in: query, schema: {type: string}}
      - {name: account, in: query, schema: {type: string, format: uuid}}
      - {name: method, in: query, schema: {type: string}}
      - {name: from, in: query, schema: {type: string, format: date-time}}
      - {name: to, in: query, schema: {type: string, format: date-time}}
    get:
      operationId: listFinancialOperations
      security: [{SessionCookie: []}, {MerchantBearer: []}]
      responses:
        '200': {description: 'Scoped masked items, at most 50, next_cursor; source unavailable is not an empty list.'}
        '401': {description: Authentication required}
        '403': {description: Role or environment denied}
        '503': {description: Pipeline or realm unavailable}
    post:
      operationId: createFinancialConnection
      security: [{SessionCookie: []}]
      description: 'Owner/admin only. Devices require account_id/name/source/binding/parser_id; gateways require method/account_number; webhooks require HTTPS url. Only mutation returns pairing_token/signing_secret.'
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses:
        '200': {description: Configuration persisted; once-visible capability where applicable}
        '403': {description: Owner/admin and permitted origin required}
        '409': {description: Identity conflict}
        '503': {description: Configuration unavailable}
  /v1/workspaces/{workspaceID}/operations/{resource}/{resourceID}:
    parameters:
      - {name: workspaceID, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: resource, in: path, required: true, schema: {type: string, enum: [payments, incoming, gateways, devices, webhooks, deliveries, events, notices]}}
      - {name: resourceID, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: environment, in: query, required: true, schema: {type: string, enum: [sandbox, live]}}
    get:
      operationId: getFinancialOperation
      security: [{SessionCookie: []}, {MerchantBearer: []}]
      responses:
        '200': {description: 'Scoped detail in items; deliveries uses resourceID as endpoint filter; notices uses resourceID as payment ID, excludes recipient ciphertext.'}
        '403': {description: Denied}
        '503': {description: Source unavailable}
  /v1/workspaces/{workspaceID}/operations/{resource}/{resourceID}/{action}:
    parameters:
      - {name: workspaceID, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: resource, in: path, required: true, schema: {type: string, enum: [incoming, gateways, devices, webhooks, deliveries, notices]}}
      - {name: resourceID, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: action, in: path, required: true, schema: {type: string, enum: [revoke, rename, reprocess, enable, disable, rotate, replay, retry]}}
      - {name: environment, in: query, required: true, schema: {type: string, enum: [sandbox, live]}}
    post:
      operationId: changeFinancialConnection
      security: [{SessionCookie: []}]
      description: 'Owner/admin; valid transitions checked in PostgreSQL. Reprocess cannot approve funds. Replay delivers the same event without payment re-execution. Notice retry requires a 10-400 character reason and explicit authorization of possible duplicate email; never changes paid funds.'
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses:
        '200': {description: Audited transition committed}
        '403': {description: Denied}
        '404': {description: Resource or transition unavailable}
        '503': {description: Source unavailable}
  /v1/device/pairing-preview:
    post:
      operationId: previewMobileWorkspace
      summary: Read workspace identity before explicit pairing consent
      description: |
        Uses a valid unconsumed eight-character pairing capability. Does not claim
        a device, consume the token, register a key, or authorize SMS collection.
        Resolves the workspace and enabled products from the authoritative database.
        Requires additive control 0114 and financial 0115 migrations. Response is no-store.
        Currently supports existing Payment phone pairing codes; AI-only enrollment
        requires its separate control-plane device identity path.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [pairing_token]
              properties:
                pairing_token: {type: string, pattern: '^[ABCDEFGHJKLMNPQRSTUVWXYZ23456789]{8}$'}
      responses:
        '200':
          description: Scoped workspace identity and current products
          content:
            application/json:
              schema:
                type: object
                required: [workspace_id, workspace_name, environment, products, expires_at]
                properties:
                  workspace_id: {type: string, format: uuid}
                  workspace_name: {type: string}
                  environment: {type: string, enum: [sandbox, live]}
                  expires_at: {type: string, format: date-time}
                  products:
                    type: object
                    required: [ai, payments]
                    properties:
                      ai: {type: boolean}
                      payments: {type: boolean}
        '403': {description: Pairing unavailable or workspace disabled}
        '413': {description: Body too large}
        '422': {description: Invalid pairing code}
        '429': {description: Preview budget exceeded}
        '503': {description: Workspace source or migration unavailable}
  /v1/device/{action}:
    parameters:
      - {name: action, in: path, required: true, schema: {type: string, enum: [claim, heartbeat, events, history]}}
      - {name: X-Ekmivo-Device-ID, in: header, schema: {type: string, format: uuid}}
      - {name: X-Ekmivo-Event-ID, in: header, required: true, schema: {type: string, pattern: '^[a-zA-Z0-9_-]{1,128}$'}}
      - {name: X-Ekmivo-Timestamp, in: header, required: true, schema: {type: string}}
      - {name: X-Ekmivo-Signature, in: header, required: true, schema: {type: string, contentEncoding: base64}}
    post:
      operationId: signedDeviceRequest
      description: |
        P-256 SHA256 DER Base64 over newline-delimited method/path/Unix-seconds timestamp/event ID/SHA256(raw-body) hex. Transport freshness ±300 seconds.
        Claim body: pairing_token/public_key (X.509 DER Base64), signed by that key. Other bodies bind enrollment_id/environment to registered device.
        Events: durable sequence >0, source/binding/kind (device_sms/device_notification)/evidence/observed_at. Full actual payer and original transaction time parsed server-side. No customer TrxID entry.
        Offline retry preserves queued bytes/event ID/sequence and refreshes transport timestamp/signature. ACK means durable storage, not verified payment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - { $ref: '#/components/schemas/DeviceClaimRequest' }
                - { $ref: '#/components/schemas/DeviceHeartbeatRequest' }
                - { $ref: '#/components/schemas/DeviceEventRequest' }
                - { $ref: '#/components/schemas/DeviceHistoryRequest' }
      responses:
        '200': {description: Enrollment or health or masked device history}
        '202':
          description: Evidence transaction committed; does not verify funds
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceDurableAck' }
        '403': {description: Device proof or fresh authorization rejected}
        '409': {description: Reused identity with changed payload}
        '413': {description: Body too large}
        '422': {description: Invalid bound envelope}
        '429': {description: Rate limited}
        '503': {description: Source or parser unavailable}
  /healthz:
    get:
      operationId: getHealth
      tags: [Operations]
      summary: Check process liveness (not payment readiness)
      responses:
        '200':
          description: Go process responsive
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status:
                    type: string
                    const: ok
                  service:
                    type: string
                    const: ekmivo-api
  /readyz:
    get:
      operationId: getReadiness
      tags: [Operations]
      summary: Financial functionality readiness
      description: Remains HTTP 503 until PG04–PG09 services are functional.
      responses:
        '503':
          description: Financial services unavailable
          content:
            application/json:
              schema:
                type: object
                required: [status, reason]
                properties:
                  status:
                    type: string
                    const: not_ready
                  reason:
                    type: string
                    const: financial_services_not_implemented
  /v1/merchant/context:
    get:
      operationId: getMerchantContext
      tags: [Merchant]
      summary: Authenticate a scoped merchant API key without performing financial work
      description: |
        Requires payments:read. Workspace, environment, expiry, revocation
        and enabled Payments product are server verified. Keys are hash-only,
        generated in the owner/admin dashboard and shown once. Sandbox and
        Live credentials are never interchangeable.
      security:
        - MerchantBearer: []
      parameters:
        - name: environment
          in: query
          required: true
          description: Exact API-key environment. Not an authorization override.
          schema:
            type: string
            enum: [sandbox, live]
      responses:
        '200':
          description: Authorized credential context (not payment-readiness proof)
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantContext'
        '400':
          $ref: '#/components/responses/BadEnvironment'
        '401':
          $ref: '#/components/responses/InvalidCredential'
        '403':
          $ref: '#/components/responses/ScopeDenied'
        '503':
          $ref: '#/components/responses/AuthUnavailable'
  /v1/workspaces/{workspaceID}/linked-sources:
    parameters:
      - name: workspaceID
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: environment
        in: query
        required: true
        schema: { type: string, enum: [sandbox, live] }
    get:
      operationId: listLinkedBillingSources
      tags: [Merchant]
      summary: List issued immutable order/invoice source snapshots (sandbox only)
      security:
        - MerchantBearer: []
        - SessionCookie: []
      responses:
        '200':
          description: Last 50 tenant-realm-bound issued sources
          content:
            application/json:
              schema:
                type: object
                required: [data, environment]
                properties:
                  environment: { type: string, const: sandbox }
                  data: { type: array, items: { $ref: '#/components/schemas/BillingSource' } }
        '403': { description: Read scope denied }
        '503': { description: Dependency or live source unavailable }
    post:
      operationId: issueLinkedBillingSource
      tags: [Merchant]
      summary: Persist a real immutable merchant-issued source with server-calculated total
      description: |
        Minimum PG05 sandbox document source of truth, not a complete invoice
        system. Merchant authors the line prices, server computes sum(qty*unit)
        and freezes the issued terms. NO caller-controlled total is accepted.
        Requires payments:write and valid workspace/environment.
      security:
        - MerchantBearer: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [source_kind, source_reference, items]
              properties:
                source_kind: { type: string, enum: [order, invoice] }
                source_reference: { type: string, minLength: 1, maxLength: 128 }
                items:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: object
                    additionalProperties: false
                    required: [title, quantity, unit_amount_minor]
                    properties:
                      title: { type: string, minLength: 1, maxLength: 160 }
                      quantity: { type: integer, minimum: 1, maximum: 9999 }
                      unit_amount_minor: { type: integer, minimum: 1, maximum: 100000000000 }
      responses:
        '201':
          description: Immutable issued source with total computed by database
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingSource' }
        '403': { description: Write scope denied }
        '409': { description: Duplicate issued document reference }
        '422': { description: Invalid line or total overflow }
        '503': { description: Dependency unavailable }
  /v1/payment/create:
    post:
      operationId: createSimplePayment
      summary: Create a hosted payment
      description: Creates an immutable payment using the existing intent engine. Optional webhook_url is bound automatically; manual registration is not required.
      security: [{ MerchantBearer: [] }]
      parameters:
        - in: header
          name: Idempotency-Key
          schema: { type: string, minLength: 16, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: number, exclusiveMinimum: 0, maximum: 1000000000, multipleOf: 0.01 }
                redirect_url: { type: string, format: uri }
                webhook_url: { type: string, format: uri, description: Optional public HTTPS destination for this payment. }
                cancel_url: { type: string, format: uri }
                reference: { type: string, maxLength: 128 }
                customer_name: { type: string, maxLength: 160 }
                customer_email: { type: string, maxLength: 254 }
                customer_phone: { type: string, maxLength: 32 }
                metadata: { type: object, additionalProperties: true }
      responses:
        '201':
          description: Created, not paid. Legacy fields remain available.
          content:
            application/json:
              schema:
                type: object
                required: [invoice_id, status]
                properties:
                  invoice_id: { type: string, format: uuid }
                  payment_url: { type: string, format: uri }
                  status: { type: string, enum: [PENDING, COMPLETED, CANCELLED, EXPIRED, FAILED, REFUNDED] }
        default:
          description: Request rejected or source unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /v1/payment/verify:
    post:
      operationId: verifySimplePayment
      summary: Read authoritative payment status by invoice_id
      description: Read-only lookup. Match invoice_id, amount_minor and currency against the stored order before fulfilment. A webhook or redirect alone is not proof.
      security: [{ MerchantBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invoice_id]
              additionalProperties: false
              properties:
                invoice_id: { type: string, format: uuid }
      responses:
        '200':
          description: Lookup succeeded; status must equal COMPLETED before fulfilment.
          content:
            application/json:
              schema:
                type: object
                required: [invoice_id, status, amount_minor, currency]
                properties:
                  invoice_id: { type: string, format: uuid }
                  status: { type: string, enum: [PENDING, COMPLETED, CANCELLED, EXPIRED, FAILED, REFUNDED] }
                  amount_minor: { type: integer }
                  currency: { type: string }
                  reference: { type: string }
        default:
          description: Request rejected or source unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /v1/payment-intents:
    get:
      operationId: listPaymentIntentsKey
      summary: List up to 50 tenant/environment-scoped issued requests
      tags: [Merchant]
      security:
        - MerchantBearer: []
      responses:
        '200':
          description: Authorized list of actual financial records
          content:
            application/json:
              schema:
                type: object
                required: [data, environment]
                properties:
                  environment: { type: string, const: sandbox }
                  data: { type: array, items: { $ref: '#/components/schemas/Intent' } }
        '401': { description: Not authenticated }
        '403': { description: Read scope or business denied }
        '503': { description: Financial database or live source unavailable }
    post:
      operationId: createPaymentIntentKey
      summary: Issue an immutable standalone or order/invoice-linked BDT request
      tags: [Merchant]
      description: |
        Simple standalone payments require only amount (BDT); redirect_url is optional for apps and bots
        (HTTPS). The server derives BDT/paisa, merchant_reference, currency BDT
        and default expiry (30 minutes). Existing integrations may continue
        sending amount_minor, merchant_reference, currency and expiry.
        Linked order/invoice requests still resolve the amount from the
        frozen tenant source. Supplying amount and amount_minor together is
        invalid. Idempotency-Key is optional but strongly recommended: reuse
        the same key and body to get a single intent on retries.
        webhook_url is securely bound to this payment automatically;
        signed webhook delivery is handled by the normal endpoint worker.
        A redirect or unsigned callback never proves payment.
      security:
        - MerchantBearer: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Recommended stable identifier for safe server retries.
          schema: { type: string, minLength: 16, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              oneOf:
                - required: [amount]
                - required: [amount_minor]
                - required: [order_id]
                - required: [invoice_id]
              properties:
                amount: { type: number, minimum: 0.01, maximum: 1000000000, multipleOf: 0.01, description: "Amount in BDT, max two decimal places. No floats are used for server money arithmetic." }
                redirect_url: { type: string, format: uri, maxLength: 2048, description: "Public HTTPS return page; not payment proof." }
                cancel_url: { type: string, format: uri, maxLength: 2048 }
                webhook_url: { type: string, format: uri, maxLength: 2048, description: "Optional public HTTPS callback bound to this payment. Automatic callback signing secret is available in API Keys." }
                customer_name: { type: string, maxLength: 160 }
                customer_email: { type: string, format: email, maxLength: 254 }
                customer_phone: { type: string, maxLength: 32 }
                metadata: { type: object, description: "Merchant-only JSON object, maximum 2048 bytes." }
                reference: { type: string, minLength: 1, maxLength: 128 }
                merchant_reference: { type: string, minLength: 1, maxLength: 128, deprecated: true }
                amount_minor: { type: integer, minimum: 1, maximum: 100000000000, deprecated: true }
                order_id: { type: string, format: uuid }
                invoice_id: { type: string, format: uuid }
                currency: { type: string, const: BDT, default: BDT }
                expires_in_minutes: { type: integer, minimum: 5, maximum: 60, default: 30 }
      responses:
        '201':
          description: Issued standalone payment request, not paid
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Intent'
                  - type: object
                    required: [checkout_token]
                    properties:
                      checkout_token: { type: string, minLength: 43, maxLength: 43 }
                      checkout_url: { type: string, format: uri, description: "Present when the public HTTPS web origin is configured." }
        '401': { description: Unauthenticated }
        '403': { description: Write scope denied }
        '409': { description: Duplicate reference or changed idempotency payload }
        '404': { description: Linked source absent from authorized realm }
        '422': { description: "Invalid amount, expiry, mixed source or caller-forged linked total" }
        '503': { description: Finance or live source unavailable }
  /v1/payment-intents/{intentID}:
    get:
      operationId: getPaymentIntentKey
      tags: [Merchant]
      summary: Read original issued terms, linked lines and immutable history
      security:
        - MerchantBearer: []
      parameters:
        - name: workspaceID
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: intentID
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: environment
          in: query
          required: true
          schema: { type: string, enum: [sandbox, live] }
      responses:
        '200':
          description: Masked payer, issued source lines and append-only events
          content:
            application/json:
              schema:
                type: object
                required: [data, environment]
                properties:
                  environment: { type: string, const: sandbox }
                  data:
                    allOf:
                      - $ref: '#/components/schemas/Intent'
                      - type: object
                        properties:
                          items:
                            type: [array, 'null']
                            items:
                              type: object
                              properties:
                                title: { type: string }
                                quantity: { type: integer }
                                unit_amount_minor: { type: integer }
                          attempt:
                            type: [object, 'null']
                            properties:
                              payer_suffix: { type: string, pattern: '^[0-9]{4}$' }
                              method: { type: string, enum: [bkash, nagad, rocket] }
                              window_start: { type: string, format: date-time }
                              window_end: { type: string, format: date-time }
                          events:
                            type: array
                            items:
                              type: object
                              required: [event_type, reason, occurred_at]
                              properties:
                                event_type: { type: string, enum: [created, payer_locked, cancelled] }
                                reason: { type: string }
                                occurred_at: { type: string, format: date-time }
        '401': { description: Not authenticated }
        '403': { description: Tenant or read scope denied }
        '404': { description: Request not found in authorized tenant/environment }
        '429':
          description: Per-process authenticated workspace budget exceeded
          headers:
            Retry-After:
              schema: { type: integer, const: 60 }
        '503': { description: Finance or live source unavailable }
  /v1/payment-intents/{intentID}/cancel:
