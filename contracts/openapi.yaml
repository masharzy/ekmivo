      responses:
        '200': { description: Cancelled or previously cancelled }
        '403': { description: Workspace permission denied }
        '404': { description: Intent not found in authorized realm }
        '409': { description: Intent already paid or expired }
        '503': { description: Finance source unavailable }
  /v1/payment-intents/{intentID}/verify-transaction:
    post:
      operationId: lookupVerifiedReceiptByTrxID
      tags: [Merchant]
      summary: Read-only TrxID-assisted lookup of an already verified payment
      description: |
        This request does not consume a transaction, verify raw SMS, charge a credit
        or mark money paid. It only reports an already uniquely matched, verified
