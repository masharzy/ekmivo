        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [transaction_id, provider, amount_minor]
              properties:
                transaction_id: { type: string, minLength: 4, maxLength: 128 }
                provider: { type: string, enum: [bkash, nagad, rocket] }
                amount_minor: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Read-only status of uniquely matched payment for the requested intent
          content:
            application/json:
              schema:
                type: object
                required: [verified, status, payment_intent_id]
                properties:
                  verified: { type: boolean }
                  status: { type: string, enum: [pending, verified] }
                  payment_intent_id: { type: string, format: uuid }
                  payment_id: { type: string, format: uuid }
