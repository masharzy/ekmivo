  /v1/public/checkout/{token}:
    get:
      operationId: getCheckoutStatus
      tags: [Checkout]
      summary: Safe public capability lookup and authoritative status
      security: []
      parameters:
        - $ref: '#/components/parameters/CheckoutToken'
      responses:
        '200':
          description: Opaque-token scope only, no full payer, no raw evidence
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
            Referrer-Policy: { schema: { type: string, const: no-referrer } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Checkout' }
        '404': { description: Invalid or unprovisioned capability }
        '503': { description: Financial service unavailable }
  /v1/public/checkout/{token}/lock:
    post:
      operationId: lockCheckoutPayer
      tags: [Checkout]
      summary: Confirm actual payer, receiving method and immutable attempt window
      description: |
        The full payer number is normalized server-side, persisted only as keyed
        digest and last-four suffix. Repeating identical lock returns the same
        attempt; changed payer/method or overlapping active evidence bucket is
        409. This does not assert that money was sent or verified.
      security: []
      parameters:
        - $ref: '#/components/parameters/CheckoutToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payer_number, method]
              additionalProperties: false
              properties:
                payer_number: { type: string, minLength: 11, maxLength: 20 }
                method: { type: string, enum: [bkash, nagad, rocket] }
      responses:
        '200':
          description: Locked payer and route, awaiting payment evidence only
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Checkout' }
        '403': { description: Browser origin denied }
        '404': { description: Checkout capability missing }
        '409': { description: "Expired, changed payer, cancelled or overlap conflict" }
        '422': { description: Invalid full payer or method }
        '503': { description: Financial service unavailable }
components:
  parameters:
    CheckoutToken:
      name: token
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{43}$'
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: ekmivo-session
    MerchantBearer:
      type: http
      scheme: bearer
      bearerFormat: ek_test_<publicId>_<random32> or ek_live_<publicId>_<random32>
      description: |
        256-bit random server-side bearer secret, never put into browser JavaScript,
        query strings or client SDK bundles; store in a server-side secret manager.
  schemas:
    DeviceClaimRequest:
      type: object
      additionalProperties: false
      required: [pairing_token, public_key]
      properties:
        pairing_token: {type: string, pattern: '^[A-Za-z0-9_-]{43}$'}
        public_key: {type: string, contentEncoding: base64, description: "P-256 X.509 DER public key; possession proven by the request signature"}
    DeviceHeartbeatRequest:
      type: object
      additionalProperties: false
      required: [enrollment_id, environment, permission_ok, backlog, overflow_count, queue_error, model, app_version]
      properties:
        enrollment_id: {type: string, format: uuid}
        environment: {type: string, enum: [sandbox, live]}
        permission_ok: {type: boolean}
        backlog: {type: integer, minimum: 0, maximum: 10000}
        overflow_count: {type: integer, format: int64, minimum: 0, description: "Monotonic tally of dropped receipt captures at the 500-event encrypted outbox quota"}
        queue_error: {type: string, maxLength: 64, pattern: '^[A-Z0-9_]*$', description: "Diagnostic code only, never receipt text"}
        model: {type: string}
        app_version: {type: string}
    DeviceEventRequest:
      type: object
      additionalProperties: false
      required: [enrollment_id, environment, source, binding, kind, evidence, observed_at, sequence]
      properties:
        enrollment_id: {type: string, format: uuid}
        environment: {type: string, enum: [sandbox, live]}
        source: {type: string}
        binding: {type: string, description: "Enrolled sms:subscriptionID or notification package binding"}
        kind: {type: string, enum: [device_sms, device_notification]}
        evidence: {type: string, maxLength: 8192, description: "Approved incoming receipt only; encrypted server-side, never merchant-facing"}
        observed_at: {type: string, format: date-time, description: "Device collection time, never a replacement for original provider transaction time"}
        sequence: {type: integer, format: int64, minimum: 1}
    DeviceHistoryRequest:
      type: object
      additionalProperties: false
      required: [enrollment_id, environment]
      properties:
        enrollment_id: {type: string, format: uuid}
        environment: {type: string, enum: [sandbox, live]}
    DeviceDurableAck:
      type: object
      required: [ack, observation_id, reason, replayed]
      properties:
        ack: {type: string, const: durable}
        observation_id: {type: [string, 'null'], format: uuid}
        reason: {type: string}
        replayed: {type: boolean}
    BillingSource:
      type: object
      required: [id, source_kind, source_reference, amount_minor, currency, issued_at, items]
      properties:
        id: { type: string, format: uuid }
        source_kind: { type: string, enum: [order, invoice] }
        source_reference: { type: string }
        amount_minor: { type: integer, minimum: 1 }
        currency: { type: string, const: BDT }
        issued_at: { type: string, format: date-time }
        items: { type: array, items: { type: object } }
    Intent:
      type: object
      required: [id, merchant_reference, amount_minor, currency, expires_at, state]
      properties:
        id: { type: string, format: uuid }
        merchant_reference: { type: string }
        amount_minor: { type: integer, minimum: 1 }
        currency: { type: string, const: BDT }
        environment: { type: string, const: sandbox }
        source_kind: { type: [string, 'null'], enum: [order, invoice, null] }
        source_id: { type: [string, 'null'], format: uuid }
        source_reference: { type: [string, 'null'] }
        expires_at: { type: string, format: date-time }
        state: { type: string, enum: [requires_payer, awaiting_payment, processing, completed, expired, cancelled] }
    Checkout:
      allOf:
        - $ref: '#/components/schemas/Intent'
        - type: object
          properties:
            merchant_name: { type: string, description: Current enabled business name from control-plane records }
            brand:
              type: object
              properties:
                logo_url: {type: [string, 'null'], format: uri}
                checkout_title: {type: [string, 'null']}
                checkout_description: {type: [string, 'null']}
                support_url: {type: [string, 'null'], format: uri}
                support_email: {type: [string, 'null'], format: email}
                legal_url: {type: [string, 'null'], format: uri}
                locale: {type: [string, 'null'], enum: [en, bn, null]}

            server_time: { type: string, format: date-time }
            source_reference: { type: string }
            items:
              type: array
              items:
                type: object
                properties:
                  title: { type: string }
                  quantity: { type: integer }
                  unit_amount_minor: { type: integer }
            payer_suffix: { type: [string, 'null'], pattern: '^[0-9]{4}$' }
            method: { type: [string, 'null'], enum: [bkash, nagad, rocket, null] }
            methods: { type: array, items: { type: string, enum: [bkash, nagad, rocket] } }
            destination: { type: [string, 'null'] }
            verification_available: { type: boolean, const: false }
    MerchantContext:
      type: object
      additionalProperties: false
      required: [workspace_id, environment, key_id, scopes, financial_api_ready]
      properties:
        workspace_id:
          type: string
          format: uuid
        environment:
          type: string
          enum: [sandbox, live]
        key_id:
          type: string
          format: uuid
        scopes:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/KeyScope'
        financial_api_ready:
          type: boolean
          const: false
    KeyScope:
      type: string
      enum:
        - payments:read
        - payments:write
        - customers:read
        - customers:write
        - invoices:read
        - invoices:write
        - refunds:read
        - refunds:write
        - webhooks:manage
        - orders:read
        - orders:write
    ApiError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, retryable, correlation_id]
          additionalProperties: false
          properties:
            code:
              type: string
              enum: [INVALID_ENVIRONMENT, INVALID_API_KEY, SCOPE_OR_ENVIRONMENT_DENIED, AUTH_SERVICE_UNAVAILABLE]
            message:
              type: string
            retryable:
              type: boolean
            correlation_id:
              type: string
              pattern: '^[a-f0-9]{24}$'
  responses:
    BadEnvironment:
      description: Missing, repeated or unsupported environment
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    InvalidCredential:
      description: Invalid, revoked or expired merchant key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ScopeDenied:
      description: Authenticated key cannot access required scope/environment
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    AuthUnavailable:
      description: Credential database unavailable; safe to retry
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
