  /v1/workspaces/{workspaceID}/exports/{exportID}:
    $ref: './payment-extensions.yaml#/paths/~1v1~1workspaces~1{workspaceID}~1exports~1{exportID}'
  /v1/workspaces/{workspaceID}/exports/{exportID}/download:
