  /v1/workspaces/{workspaceID}/integrations:
    $ref: './payment-extensions.yaml#/paths/~1v1~1workspaces~1{workspaceID}~1integrations'
  /v1/workspaces/{workspaceID}/integrations/{integrationID}/enable:
    $ref: './payment-extensions.yaml#/paths/~1v1~1workspaces~1{workspaceID}~1integrations~1{integrationID}~1enable'
  /v1/workspaces/{workspaceID}/integrations/{integrationID}/disable:
    $ref: './payment-extensions.yaml#/paths/~1v1~1workspaces~1{workspaceID}~1integrations~1{integrationID}~1disable'
  /v1/workspaces/{workspaceID}/integrations/{integrationID}/edit:
    $ref: './payment-extensions.yaml#/paths/~1v1~1workspaces~1{workspaceID}~1integrations~1{integrationID}~1edit'
  /v1/workspaces/{workspaceID}/activity/audit:
    $ref: './payment-extensions.yaml#/paths/~1v1~1workspaces~1{workspaceID}~1activity~1audit'
  /v1/workspaces/{workspaceID}/activity/api:
