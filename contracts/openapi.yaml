openapi: 3.1.0
info:
  title: Ekmivo Payment API
  version: 0.3.0
  description: |
    PG03 implemented contract: process liveness, financial readiness, and
    real server-side merchant credential verification. Credential issue/rotate/
    revoke currently use authenticated owner/admin Next.js server actions.
    No payment-intent, checkout, receipt verification or webhook delivery endpoint
    is implemented yet; they remain PG04–PG09 / PG14 release contracts.
servers:
  - url: https://ekmivo-go-api.onrender.com
    description: Deployed Go API (does NOT imply financial readiness)
tags:
  - name: Operations
  - name: Merchant
paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [Operations]
      summary: Check process liveness (not payment readiness)
      responses:
        '200':
          description: Go process responsive
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status:
                    type: string
                    const: ok
                  service:
                    type: string
                    const: ekmivo-api
  /readyz:
    get:
      operationId: getReadiness
      tags: [Operations]
      summary: Financial functionality readiness
      description: Remains HTTP 503 until PG04–PG09 services are functional.
      responses:
        '503':
          description: Financial services unavailable
          content:
            application/json:
              schema:
                type: object
                required: [status, reason]
                properties:
                  status:
                    type: string
                    const: not_ready
                  reason:
                    type: string
                    const: financial_services_not_implemented
  /v1/merchant/context:
    get:
      operationId: getMerchantContext
      tags: [Merchant]
      summary: Authenticate a scoped merchant API key without performing financial work
      description: |
        Requires payments:read. Workspace, environment, expiry, revocation
        and enabled Payments product are server verified. Keys are hash-only,
        generated in the owner/admin dashboard and shown once. Sandbox and
        Live credentials are never interchangeable.
      security:
        - MerchantBearer: []
      parameters:
        - name: environment
          in: query
          required: true
          description: Exact API-key environment. Not an authorization override.
          schema:
            type: string
            enum: [sandbox, live]
      responses:
        '200':
          description: Authorized credential context (not payment-readiness proof)
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantContext'
        '400':
          $ref: '#/components/responses/BadEnvironment'
        '401':
          $ref: '#/components/responses/InvalidCredential'
        '403':
          $ref: '#/components/responses/ScopeDenied'
        '503':
          $ref: '#/components/responses/AuthUnavailable'
components:
  securitySchemes:
    MerchantBearer:
      type: http
      scheme: bearer
      bearerFormat: ek_test_<publicId>_<random32> or ek_live_<publicId>_<random32>
      description: |
        256-bit random server-side bearer secret, never put into browser JavaScript,
        query strings or client SDK bundles; store in a server-side secret manager.
  schemas:
    MerchantContext:
      type: object
      additionalProperties: false
      required: [workspace_id, environment, key_id, scopes, financial_api_ready]
      properties:
        workspace_id:
          type: string
          format: uuid
        environment:
          type: string
          enum: [sandbox, live]
        key_id:
          type: string
          format: uuid
        scopes:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/KeyScope'
        financial_api_ready:
          type: boolean
          const: false
    KeyScope:
      type: string
      enum:
        - payments:read
        - payments:write
        - customers:read
        - customers:write
        - invoices:read
        - invoices:write
        - refunds:read
        - refunds:write
        - webhooks:manage
    ApiError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, retryable]
          additionalProperties: false
          properties:
            code:
              type: string
              enum: [INVALID_ENVIRONMENT, INVALID_API_KEY, SCOPE_OR_ENVIRONMENT_DENIED, AUTH_SERVICE_UNAVAILABLE]
            message:
              type: string
            retryable:
              type: boolean
  responses:
    BadEnvironment:
      description: Missing, repeated or unsupported environment
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    InvalidCredential:
      description: Invalid, revoked or expired merchant key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ScopeDenied:
      description: Authenticated key cannot access required scope/environment
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    AuthUnavailable:
      description: Credential database unavailable; safe to retry
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
