  /v1/workspaces/{workspaceID}/billing:
    $ref: './payment-extensions.yaml#/paths/~1v1~1workspaces~1{workspaceID}~1billing'
  /v1/workspaces/{workspaceID}/billing/{invoiceID}/reconcile:
    $ref: './payment-extensions.yaml#/paths/~1v1~1workspaces~1{workspaceID}~1billing~1{invoiceID}~1reconcile'
  /v1/workspaces/{workspaceID}/billing/free:
