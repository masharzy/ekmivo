  /v1/workspaces/{workspaceID}/notifications/{notificationID}/read:
    $ref: './payment-extensions.yaml#/paths/~1v1~1workspaces~1{workspaceID}~1notifications~1{notificationID}~1read'
  /v1/workspaces/{workspaceID}/privacy/{requestID}/cancel:
    $ref: './payment-extensions.yaml#/paths/~1v1~1workspaces~1{workspaceID}~1privacy~1{requestID}~1cancel'
  /v1/workspaces/{workspaceID}/workspace-tools/team:
    $ref: './payment-extensions.yaml#/paths/~1v1~1workspaces~1{workspaceID}~1workspace-tools~1team'
  /v1/workspaces/{workspaceID}/workspace-tools/settings:
    $ref: './payment-extensions.yaml#/paths/~1v1~1workspaces~1{workspaceID}~1workspace-tools~1settings'
  /v1/workspaces/{workspaceID}/workspace-tools/help:
    $ref: './payment-extensions.yaml#/paths/~1v1~1workspaces~1{workspaceID}~1workspace-tools~1help'
  /v1/workspaces/{workspaceID}/privacy:
