name: Android release APK build (no emulator)
on:
  push:
    branches: [main]
    paths:
      - apps/mobile/**
      - .github/workflows/android-offline-signing.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  unsigned_release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdk_manager="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          "$sdk_manager" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Run unit checks and build release APK
        working-directory: apps/mobile
        env:
          EKMIVO_FIREBASE_APPLICATION_ID: ${{ vars.EKMIVO_FIREBASE_APPLICATION_ID }}
          EKMIVO_FIREBASE_API_KEY: ${{ vars.EKMIVO_FIREBASE_API_KEY }}
          EKMIVO_FIREBASE_PROJECT_ID: ${{ vars.EKMIVO_FIREBASE_PROJECT_ID }}
          EKMIVO_FIREBASE_SENDER_ID: ${{ vars.EKMIVO_FIREBASE_SENDER_ID }}
        run: gradle --no-daemon --console=plain :app:testDebugUnitTest :app:assembleRelease
      - name: Prepare offline signing tools and identity
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir offline-signing
          cp apps/mobile/app/build/outputs/apk/release/app-release-unsigned.apk offline-signing/
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          cp "$sdk_root/build-tools/35.0.0/lib/apksigner.jar" offline-signing/
          "$sdk_root/build-tools/35.0.0/aapt" dump badging offline-signing/app-release-unsigned.apk | head -1 > offline-signing/package.txt
          printf '%s\n' "$SOURCE_SHA" > offline-signing/source-commit.txt
          cd offline-signing
          sha256sum app-release-unsigned.apk apksigner.jar > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ekmivo-release-build
          path: offline-signing/
          if-no-files-found: error
          retention-days: 7
