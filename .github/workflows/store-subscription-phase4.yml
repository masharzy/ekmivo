name: Store Subscription Phase 4 Focused Gate

on:
  push:
    branches: [agents/store-subscription-phase4-intents]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase4-intents-${{ github.ref }}
  cancel-in-progress: true

jobs:
  purchase-intents:
    name: Real SQL lifecycle, security and web contract
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ekmivo_pg00
          POSTGRES_USER: ekmivo_test
          POSTGRES_PASSWORD: local-only-ci-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ekmivo_test -d ekmivo_pg00"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install exact locked web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Check only Phase 4 owned sources
        working-directory: apps/web
        run: npx eslint src/lib/purchase-capability.ts src/lib/server/purchase-intents.ts src/components/free-purchase-claim.tsx src/app/api/platform/purchase-intents scripts/subscription-intents-contract.test.mjs scripts/subscription-intents-pg-smoke.mjs
      - name: Phase 4 capability, lifecycle, auth continuation contracts
        working-directory: apps/web
        run: node --test scripts/subscription-intents-contract.test.mjs scripts/briofold-onboarding-actions.test.mjs
      - name: Isolated PostgreSQL lifecycle and revision guards
        working-directory: apps/web
        env:
          PG00_TEST_DATABASE_URL: postgresql://ekmivo_test:local-only-ci-password@127.0.0.1:5432/ekmivo_pg00
        run: node scripts/subscription-intents-pg-smoke.mjs
