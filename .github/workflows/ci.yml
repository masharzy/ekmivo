name: Foundation CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: pg00-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Next.js lint, build and isolated PostgreSQL smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ekmivo_pg00
          POSTGRES_USER: ekmivo_test
          POSTGRES_PASSWORD: local-only-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ekmivo_test -d ekmivo_pg00"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Clean dependency install
        working-directory: apps/web
        run: npm ci
      - name: Production dependency security audit
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high
      - name: Lint all web sources
        working-directory: apps/web
        run: npm run lint
      - name: Briofold Phase 1 design boundary and responsive contract
        working-directory: apps/web
        run: node --test scripts/briofold-design-boundary.test.mjs scripts/dashboard-responsive-cascade.test.mjs
      - name: Briofold Phase 2 and 3 canonical route and authorization contract
        working-directory: apps/web
        run: node --test scripts/briofold-unified-routes.test.mjs scripts/briofold-locale-routing.test.mjs scripts/briofold-account-settings-routing.test.mjs scripts/briofold-unified-devices.test.mjs scripts/briofold-ai-overview.test.mjs scripts/briofold-ai-business-profile.test.mjs scripts/briofold-ai-team-quota.test.mjs scripts/briofold-settings-interactions.test.mjs
      - name: Briofold Phase 9 canonical finance-source detail contract
        working-directory: apps/web
        run: node --test scripts/briofold-phase9-payment-links.test.mjs
      - name: Single Store signup, switching and typography regression contracts
        working-directory: apps/web
        run: node --test scripts/primary-store-binding-contract.test.mjs
      - name: Briofold Phase 4 and 5 onboarding and prepaid safety contract
        working-directory: apps/web
        run: node --test scripts/briofold-onboarding-client.test.mjs scripts/signup-transaction-smoke.mjs scripts/briofold-onboarding-contract.test.mjs scripts/briofold-onboarding-actions.test.mjs scripts/briofold-ai-tariff.test.mjs scripts/briofold-topup-proxy.test.mjs scripts/briofold-topup-proof-integrity.test.mjs
      - name: Briofold full AI wallet statement and low balance contract
        working-directory: apps/web
        run: node --test scripts/briofold-commerce-import.test.mjs scripts/briofold-ai-statement.test.mjs scripts/briofold-ai-studio.test.mjs scripts/briofold-inbox-drafts.test.mjs scripts/briofold-inbox-attachments.test.mjs scripts/briofold-studio-requests.test.mjs
      - name: Store subscription order, legal policy and coupon safety contracts
        working-directory: apps/web
        run: node --test scripts/subscription-order-contract.test.mjs scripts/subscription-coupons-contract.test.mjs scripts/subscription-policies-contract.test.mjs scripts/subscription-offers-contract.test.mjs
      - name: Typecheck Next.js application before long-running integration tests
        working-directory: apps/web
        run: npx tsc --noEmit -p tsconfig.json
      - name: Production build (no application credentials)
        working-directory: apps/web
        run: npm run build
      - name: Verify locked Admin design tokens and theme isolation
        run: python3 apps/web/scripts/verify-admin-design.py
      - name: Strict OpenAPI contract and schema references
        working-directory: apps/web
        run: npm run payment:contract-check
      - name: Typecheck generated merchant SDK and TypeScript integrations
        working-directory: apps/web
        run: npx tsc --noEmit -p tsconfig.payment-examples.json
      - name: Release gate negative tests (fictional fixtures)
        run: node --test tools/release/evidence.test.mjs tools/testing/sdk-transport.test.mjs tools/privacy/store-registry.test.mjs tools/privacy/archive-codec.test.mjs tools/recovery/backup-registry.test.mjs tools/release/compile-cohort.test.mjs tools/testing/pg06-physical-phone-contract.test.mjs tools/testing/pg10-physical-phone-intent.test.mjs tools/testing/public-pay-design.test.mjs tools/testing/checkout-logo-presentation.test.mjs tools/testing/notification-center.test.mjs
      - name: Verify PostgreSQL schema on ephemeral local database
        working-directory: apps/web
        env:
          PG00_TEST_DATABASE_URL: postgresql://ekmivo_test:local-only-ci-password@127.0.0.1:5432/ekmivo_pg00
        run: node scripts/pg00-smoke.mjs
      - name: PG01 RLS 3-tenant/2-environment integration checks
        working-directory: apps/web
        env:
          PG00_TEST_DATABASE_URL: postgresql://ekmivo_test:local-only-ci-password@127.0.0.1:5432/ekmivo_pg00
        run: node scripts/pg01-rls-smoke.mjs
      - name: PG02 product-access migration and authorization matrix
        working-directory: apps/web
        env:
          PG00_TEST_DATABASE_URL: postgresql://ekmivo_test:local-only-ci-password@127.0.0.1:5432/ekmivo_pg00
        run: node scripts/pg02-product-access-smoke.mjs
      - name: Go and PostgreSQL session authorization integration
        working-directory: backend
        env:
          PG00_TEST_DATABASE_URL: postgresql://ekmivo_test:local-only-ci-password@127.0.0.1:5432/ekmivo_pg00
          PG01_RUNTIME_DATABASE_URL: postgresql://ekmivo_financial_runtime:pg01-ci-only-password@127.0.0.1:5432/ekmivo_pg00
        run: |
          go mod tidy
          go test ./internal/authz -run TestPostgresSessionMembershipAndEnvironment -count=1 -v
      - name: RFC6238 TOTP and replay vectors
        working-directory: apps/web
        run: node scripts/pg01-mfa-smoke.mjs
      - name: PG02 product and environment navigation contracts
        working-directory: apps/web
        run: node scripts/pg02-navigation-smoke.mjs
      - name: PG03 scoped bearer key hash, RLS and environment security
        working-directory: apps/web
        env:
          PG00_TEST_DATABASE_URL: postgresql://ekmivo_test:local-only-ci-password@127.0.0.1:5432/ekmivo_pg00
        run: node scripts/pg03-credentials-smoke.mjs
      - name: PG02 workspace/server environment authorization checks
        working-directory: apps/web
        env:
          PG00_TEST_DATABASE_URL: postgresql://ekmivo_test:local-only-ci-password@127.0.0.1:5432/ekmivo_pg00
        run: node scripts/pg02-tenant-context-smoke.mjs
      - name: Install browser for real PG05 checkout journeys
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Website widget retry, history, XSS and keyboard acceptance
        working-directory: apps/web
        run: node --test scripts/briofold-website-widget.test.mjs
      - name: PG04 independent financial River + realm migration and durability
        working-directory: apps/web
        env:
          PG00_TEST_DATABASE_URL: postgresql://ekmivo_test:local-only-ci-password@127.0.0.1:5432/ekmivo_pg00
          PG05_BROWSER_TESTS: "true"
        run: node scripts/pg04-financial-smoke.mjs
      - name: Save PG05 isolated browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pg05-browser-evidence
          path: apps/web/test-results/pg05/
          if-no-files-found: ignore
      - name: Save PG09 isolated browser UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pg09-browser-ui-mocked-api-evidence
          path: apps/web/test-results/pg09/
          if-no-files-found: ignore
      - name: PG02 account-scoped draft security and persistence contracts
        working-directory: apps/web
        run: node scripts/pg02-draft-smoke.mjs
      - name: PG02 onboarding unsaved draft and locale switch guard
        working-directory: apps/web
        run: node scripts/pg02-onboarding-guard-smoke.mjs
      - name: PG02 account profile/session isolation against PostgreSQL
        working-directory: apps/web
        env:
          PG00_TEST_DATABASE_URL: postgresql://ekmivo_test:local-only-ci-password@127.0.0.1:5432/ekmivo_pg00
        run: node scripts/pg02-profile-smoke.mjs
      - name: PG02 locale draft-guard and theme transition contracts
        working-directory: apps/web
        run: node scripts/pg02-locale-guard-smoke.mjs
      - name: TypeScript compile
        working-directory: apps/web
        run: npx tsc --noEmit

  backend:
    name: Go compile and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Download and validate pinned Go modules
        working-directory: backend
        run: go mod tidy
      - name: Report resolved Go dependency lock for review
        working-directory: backend
        run: |
          echo "BEGIN_GO_MOD"
          cat go.mod
          echo "END_GO_MOD"
          echo "BEGIN_GO_SUM"
          cat go.sum
          echo "END_GO_SUM"
      - name: Go unit tests
        working-directory: backend
        run: |
          go test ./...
          go test -race ./internal/checkout ./internal/aicredits
          go vet ./...
      - name: Go HTTP server smoke
        working-directory: backend
        run: |
          PORT=18080 go run ./cmd/api > /tmp/pg00-api.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18080/healthz | grep -q '"status":"ok"'; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/healthz
          [ "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/readyz)" = "503" ]
      - name: Compile API and worker
        working-directory: backend
        run: |
          go build -o /tmp/ekmivo-api ./cmd/api
          go build -o /tmp/ekmivo-worker ./cmd/worker

  financial_containers:
    name: PG04 runtime and migration Docker builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile API, River worker and financial-sync in production image
        run: docker build --progress=plain -f backend/Dockerfile -t ekmivo-pg04-runtime:ci backend
      - name: Compile isolated financial migration operator image
        run: docker build --progress=plain -f infra/Dockerfile.financial-migrate -t ekmivo-pg04-migrate:ci .


  android:
    name: Native Kotlin Compose assemble and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android API 35 from GitHub runner SDK
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdk_manager="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          if [ -z "$sdk_manager" ]; then echo "Android command-line tools not found"; exit 1; fi
          "$sdk_manager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Assemble native Android debug build
        working-directory: apps/mobile
        run: gradle --no-daemon --console=plain :app:assembleDebug :app:testDebugUnitTest
      - name: Save test-only Android debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: ekmivo-kotlin-debug
          path: apps/mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

