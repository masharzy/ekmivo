name: Store Subscription Phase 6 — Focused Code and SQL Checks

# Branch-only verification. Never performs production migration, provider
# transactions, feature-flag enablement or deployment.
on:
  push:
    branches: [agents/store-subscription-phase6-payment-activation]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact Phase 6 commit SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: subscription-phase6-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web:
    name: Phase 6 Next, auth routes and contract compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exact source guard
        env:
          EXPECTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Locked npm install
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Phase 2–6 source contracts
        working-directory: apps/web
        run: node --test scripts/subscription-payment-handoff-contract.test.mjs scripts/subscription-order-contract.test.mjs scripts/subscription-intents-contract.test.mjs scripts/subscription-coupons-contract.test.mjs scripts/subscription-public-catalog.test.mjs scripts/subscription-offer-render.test.mjs
      - name: ESLint and TypeScript
        working-directory: apps/web
        run: |
          npm run lint
          npx tsc --noEmit -p tsconfig.json
      - name: Production Next build
        working-directory: apps/web
        run: npm run build

  go:
    name: Phase 6 Go policy, worker recovery, API auth and race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exact source guard
        env:
          EXPECTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Focused Go race and vet
        working-directory: backend
        run: |
          go test -race ./internal/subscriptionpayment ./internal/checkout
          go vet ./internal/checkout ./internal/subscriptionpayment ./cmd/api ./cmd/financial-migrate

  postgres:
    name: Phase 6 actual PostgreSQL quote, legal, handoff and settlement
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ekmivo_pg00
          POSTGRES_USER: ekmivo_test
          POSTGRES_PASSWORD: local-only-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ekmivo_test -d ekmivo_pg00"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exact source guard
        env:
          EXPECTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Locked PostgreSQL driver
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Phase 3–5 real SQL prerequisite authority and invoice test
        working-directory: apps/web
        env:
          PG00_TEST_DATABASE_URL: postgresql://ekmivo_test:local-only-ci-password@127.0.0.1:5432/ekmivo_pg00
        run: node scripts/subscription-order-postgres-smoke.mjs
      - name: Phase 6 real SQL roles, immutable consent, coupon settlement and recovery
        working-directory: apps/web
        env:
          PG00_TEST_DATABASE_URL: postgresql://ekmivo_test:local-only-ci-password@127.0.0.1:5432/ekmivo_pg00
        run: node scripts/subscription-payment-postgres-smoke.mjs
