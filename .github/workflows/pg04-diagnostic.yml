name: Focused PG04 diagnostic

on:
  push:
    branches: [agents/ai-commerce-phase1-pg04-diagnostic]

permissions:
  contents: read

concurrency:
  group: pg00-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Next.js lint, build and isolated PostgreSQL smoke
    if: github.head_ref != 'agents/store-subscription-phase3-coupons' && github.head_ref != 'agents/store-subscription-phase5-summary' && github.ref_name != 'agents/store-subscription-phase5-summary'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ekmivo_pg00
          POSTGRES_USER: ekmivo_test
          POSTGRES_PASSWORD: local-only-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ekmivo_test -d ekmivo_pg00"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Clean dependency install
        working-directory: apps/web
        run: npm ci
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Verify PostgreSQL schema on ephemeral local database
        working-directory: apps/web
        env:
          PG00_TEST_DATABASE_URL: postgresql://ekmivo_test:local-only-ci-password@127.0.0.1:5432/ekmivo_pg00
        run: node scripts/pg00-smoke.mjs
      - name: PG01 RLS 3-tenant/2-environment integration checks
        working-directory: apps/web
        env:
          PG00_TEST_DATABASE_URL: postgresql://ekmivo_test:local-only-ci-password@127.0.0.1:5432/ekmivo_pg00
        run: node scripts/pg01-rls-smoke.mjs
      - name: PG02 product-access migration and authorization matrix
        working-directory: apps/web
        env:
          PG00_TEST_DATABASE_URL: postgresql://ekmivo_test:local-only-ci-password@127.0.0.1:5432/ekmivo_pg00
        run: node scripts/pg02-product-access-smoke.mjs
      - name: Go and PostgreSQL session authorization integration
        working-directory: backend
        env:
          PG00_TEST_DATABASE_URL: postgresql://ekmivo_test:local-only-ci-password@127.0.0.1:5432/ekmivo_pg00
          PG01_RUNTIME_DATABASE_URL: postgresql://ekmivo_financial_runtime:pg01-ci-only-password@127.0.0.1:5432/ekmivo_pg00
        run: |
          go mod tidy
          go test ./internal/authz -run TestPostgresSessionMembershipAndEnvironment -count=1 -v
      - name: PG03 scoped bearer key hash, RLS and environment security
        working-directory: apps/web
        env:
          PG00_TEST_DATABASE_URL: postgresql://ekmivo_test:local-only-ci-password@127.0.0.1:5432/ekmivo_pg00
        run: node scripts/pg03-credentials-smoke.mjs
      - name: PG02 workspace/server environment authorization checks
        working-directory: apps/web
        env:
          PG00_TEST_DATABASE_URL: postgresql://ekmivo_test:local-only-ci-password@127.0.0.1:5432/ekmivo_pg00
        run: node scripts/pg02-tenant-context-smoke.mjs
      - name: Restore pinned Playwright browser binaries
        id: playwright
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-headless-${{ hashFiles('apps/web/package-lock.json') }}
      - name: Install browser for real PG05 checkout journeys
        working-directory: apps/web
        timeout-minutes: 6
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "45000"
        run: |
          npx --no-install playwright install --only-shell chromium
          node scripts/playwright-readiness.mjs
      - name: Prepare shared dashboard CSS tokens
        working-directory: apps/web
        run: npm run predev
      - name: PG04 independent financial River + realm migration and durability
        working-directory: apps/web
        env:
          PG04_SETTINGS_SUITES: runChannelPolicies
          PG00_TEST_DATABASE_URL: postgresql://ekmivo_test:local-only-ci-password@127.0.0.1:5432/ekmivo_pg00
          PG05_BROWSER_TESTS: "true"
        run: node scripts/pg04-financial-smoke.mjs
